name: Evaluation container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/journeyman-evaluation
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          labels: |
            org.opencontainers.image.title=Journeyman Evaluation Container
            org.opencontainers.image.description=Evaluation-only container for Journeyman
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/evaluation-container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          {
            echo "### Journeyman evaluation image"
            echo
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/journeyman-evaluation:latest"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
